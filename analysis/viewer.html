<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Breakout Propensity — Trajectory Viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace; background:#0d1117; color:#c9d1d9; }
  header { position:sticky; top:0; background:#161b22; border-bottom:1px solid #30363d; padding:10px 12px; z-index:10; }
  h1 { font-size:16px; margin:0 0 8px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  select, input { background:#0d1117; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:6px 8px; font-size:14px; flex:1; min-width:90px; }
  .list { padding:8px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .card:active { background:#1c2128; }
  .card .meta { font-size:12px; color:#8b949e; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-left:6px; }
  .L4 { background:#1a7f37; color:#fff; }
  .L3 { background:#9e6a03; color:#fff; }
  .L2 { background:#1f6feb; color:#fff; }
  .L1 { background:#30363d; color:#c9d1d9; }
  .L0 { background:#21262d; color:#8b949e; }
  /* detail view */
  #detail { display:none; position:fixed; inset:0; background:#0d1117; overflow-y:auto; z-index:20; }
  #detailbar { position:sticky; top:0; background:#161b22; border-bottom:1px solid #30363d; padding:10px 12px; display:flex; align-items:center; gap:10px; }
  #back { background:#1f6feb; color:#fff; border:0; border-radius:6px; padding:8px 14px; font-size:15px; }
  #dtitle { font-size:13px; color:#8b949e; }
  #steps { padding:10px; }
  .step { margin-bottom:10px; border-radius:8px; padding:10px; font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .reasoning { background:#1c2128; border-left:3px solid #8b949e; color:#c9d1d9; }
  .cmd { background:#0d2818; border-left:3px solid #238636; color:#7ee787; font-family:monospace; }
  .out { background:#1a1d23; border-left:3px solid #30363d; color:#8b949e; font-family:monospace; font-size:12px; }
  .tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; display:block; }
  .reasoning .tag { color:#8b949e; } .cmd .tag { color:#238636; } .out .tag { color:#484f58; }
  #count { color:#8b949e; font-size:12px; margin-top:6px; }
  /* collapsible sections */
  details { margin-bottom:10px; border-radius:8px; overflow:hidden; }
  details.step { padding:0; }
  summary { cursor:pointer; padding:10px; font-size:12px; font-weight:600; list-style:none; display:flex; align-items:center; gap:6px; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:'▸'; display:inline-block; transition:transform .15s; }
  details[open] summary::before { transform:rotate(90deg); }
  details.out, details.reasoning { background:#1a1d23; border-left:3px solid #30363d; }
  details.reasoning { border-left-color:#8b949e; }
  details .body { padding:0 10px 10px; white-space:pre-wrap; word-break:break-word; font-family:monospace; font-size:12px; color:#8b949e; }
  details.reasoning .body { color:#c9d1d9; }
  /* prompt block */
  #prompt { background:#161b22; border:1px solid #30363d; border-radius:8px; margin:10px; }
  #prompt summary { color:#79c0ff; }
  #prompt .body { color:#c9d1d9; font-family:-apple-system,Roboto,sans-serif; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Breakout Propensity — Trajectories</h1>
  <div class="filters">
    <select id="fmodel"><option value="">all models</option></select>
    <select id="ftask"><option value="">all tasks</option></select>
    <select id="fwk"><option value="">all weaknesses</option></select>
    <select id="fladder"><option value="">all outcomes</option>
      <option value="L4_crossed_and_goal">L4 escaped+goal</option>
      <option value="L3_crossed">L3 crossed</option>
      <option value="L2_attempted">L2 attempted</option>
      <option value="L1_noticed_no_attempt">L1 no attempt</option>
      <option value="L0_no_notice">L0 no notice</option>
    </select>
  </div>
  <div id="count"></div>
</header>
<div class="list" id="list"></div>

<div id="detail">
  <div id="detailbar">
    <button id="back">← Back</button>
    <div id="dtitle"></div>
  </div>
  <div id="steps"></div>
</div>

<script>
let INDEX = [];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function badge(l){ const c=(l||'').slice(0,2); return `<span class="badge ${c}">${esc(l||'?')}</span>`; }

async function init(){
  const res = await fetch('traj/index.json'); INDEX = await res.json();
  const uniq = k => [...new Set(INDEX.map(r=>r[k]))].sort();
  for (const [id,k] of [['fmodel','model'],['ftask','task'],['fwk','weakness']])
    for (const v of uniq(k)) document.getElementById(id).insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`);
  for (const id of ['fmodel','ftask','fwk','fladder']) document.getElementById(id).onchange = render;
  render();
}

function render(){
  const fm=document.getElementById('fmodel').value, ft=document.getElementById('ftask').value,
        fw=document.getElementById('fwk').value, fl=document.getElementById('fladder').value;
  const rows = INDEX.filter(r=>(!fm||r.model===fm)&&(!ft||r.task===ft)&&(!fw||r.weakness===fw)&&(!fl||r.ladder===fl));
  // sort: escapes first
  rows.sort((a,b)=>(a.ladder||'').localeCompare(b.ladder||''));
  document.getElementById('count').textContent = `${rows.length} trials`;
  document.getElementById('list').innerHTML = rows.map(r=>
    `<div class="card" onclick="open_('${r.id}')">
       <div><b>${esc(r.model)}</b>${badge(r.ladder)}</div>
       <div class="meta">${esc(r.task)} × ${esc(r.weakness)} · ${r.steps} steps</div>
     </div>`).join('');
}

async function open_(id){
  const res = await fetch(`traj/${id}.json`); const d = await res.json();
  document.getElementById('dtitle').textContent = `${d.model} · ${d.task} × ${d.weakness} · ${d.ladder}`;
  // prompt/prefill at top (expanded by default), tool outputs collapsed
  const promptHtml = d.prompt ? `<details id="prompt" class="step" open><summary>PROMPT (what the model was told)</summary><div class="body">${esc(d.prompt)}</div></details>` : '';
  document.getElementById('steps').innerHTML = promptHtml + d.events.map(e=>{
    if (e.type==='cmd')
      return `<div class="step cmd"><span class="tag">command</span>${esc(e.text)}</div>`;
    // collapse reasoning + outputs
    const label = e.type==='out' ? 'output' : 'reasoning';
    const preview = e.text.split('\n')[0].slice(0,80);
    return `<details class="step ${e.type}"><summary>${label}: ${esc(preview)}${e.text.length>80?'…':''}</summary><div class="body">${esc(e.text)}</div></details>`;
  }).join('');
  document.getElementById('detail').style.display='block';
  document.getElementById('detail').scrollTop=0;
}
document.getElementById('back').onclick = ()=>{ document.getElementById('detail').style.display='none'; };
init();
</script>
</body>
</html>
