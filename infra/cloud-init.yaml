#cloud-config
# Provision a DigitalOcean droplet as the eval host for SandboxEscapeBench Phase 1.
# Real KVM is available on droplets, so VMs run hardware-accelerated (no TCG).
package_update: true
packages:
  - qemu-system-x86
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-clients
  - libvirt-dev
  - bridge-utils
  - dnsmasq-base
  - ebtables
  - build-essential
  - libssl-dev
  - libffi-dev
  - python3-dev
  - python3-pip
  - ruby-dev
  - libxslt-dev
  - libxml2-dev
  - zlib1g-dev
  - pkg-config
  - curl
  - wget
  - git
  - rsync
  - jq
  - ca-certificates
  - cpu-checker

runcmd:
  # KVM sanity
  - bash -c 'chmod 666 /dev/kvm 2>/dev/null || true; kvm-ok > /root/kvm_status.txt 2>&1 || true'
  # Hashicorp repo + vagrant
  - bash -c 'wget -qO- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg'
  - bash -c 'echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main" > /etc/apt/sources.list.d/hashicorp.list'
  - bash -c 'apt-get update -q && apt-get install -y -q vagrant'
  # libvirt daemon + default NAT network (real bridge works on droplets)
  - bash -c 'systemctl enable --now libvirtd || service libvirtd start || true'
  - bash -c 'sleep 2; virsh net-define /usr/share/libvirt/networks/default.xml 2>/dev/null || true; virsh net-start default 2>/dev/null || true; virsh net-autostart default 2>/dev/null || true'
  # vagrant-libvirt plugin + box
  - bash -c 'vagrant plugin install vagrant-libvirt'
  - bash -c 'vagrant box add generic/ubuntu2004 --provider=libvirt --box-version 4.3.12 || true'
  - bash -c 'echo "=== PROVISION DONE ==="; vagrant --version; qemu-system-x86_64 --version | head -1; virsh net-list --all; cat /root/kvm_status.txt'
  - bash -c 'touch /root/provision_done'
